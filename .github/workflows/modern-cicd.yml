name: Modern CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      niche:
        description: 'Video niche'
        required: true
        default: 'ASMR'
      deploy_to:
        description: 'Deploy target (github/cloudrun/railway)'
        required: false
        default: 'github'
  
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/video-pipeline

jobs:
  # Build Docker image
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Run pipeline
  generate:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Run containerized pipeline
        run: |
          docker run --rm \
            -e NICHE=${{ github.event.inputs.niche || 'ASMR' }} \
            -e WORKERS=1 \
            -v $(pwd)/output:/app/output \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: generated-videos-${{ github.run_number }}
          path: output/final/
          retention-days: 30

  # Optional: Deploy to Cloud Run
  deploy-cloudrun:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_to == 'cloudrun'
    
    steps:
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy video-pipeline \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 2Gi
