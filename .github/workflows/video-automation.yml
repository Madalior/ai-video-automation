name: Video Automation Runner

on:
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video type (character or info)'
        required: true
        default: 'character'
        type: choice
        options:
          - character
          - info
      idea:
        description: 'Video idea/concept'
        required: true
        default: 'A detective solves a mystery'
      scenes:
        description: 'Number of scenes'
        required: true
        default: '5'

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb chromium-browser chromium-chromedriver ffmpeg
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install selenium webdriver-manager pillow requests beautifulsoup4 google-generativeai moviepy pysocks pyvirtualdisplay
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Setup virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      
      - name: Run video generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISPLAY: ':99'
        run: |
          echo "🎬 Starting video generation..."
          echo "Type: ${{ github.event.inputs.video_type }}"
          echo "Idea: ${{ github.event.inputs.idea }}"
          echo "Scenes: ${{ github.event.inputs.scenes }}"
          
          python master_manager.py \
            --type ${{ github.event.inputs.video_type }} \
            --idea "${{ github.event.inputs.idea }}" \
            --scenes ${{ github.event.inputs.scenes }} \
            --headless \
            --no-proxy
      
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            output/**/*.mp4
            output/**/*.png
          retention-days: 7
      
      - name: List generated files
        run: |
          echo "📁 Generated files:"
          find output -type f -name "*.mp4" -o -name "*.png" | head -20
