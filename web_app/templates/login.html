{% extends "base.html" %}

{% block title %}AUTHENTICATE — GOING MERRY™ Command Console{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 60px auto 40px;">
  <div class="tech-card" style="border: 2px solid var(--color-brand-black); box-shadow: 6px 6px 0px rgba(17, 17, 17, 0.9); padding: 32px 28px;">
    
    <!-- Lockup Center -->
    <div style="text-align: center; margin-bottom: 28px;">
      <!-- Going Merry Flagship Monogram Glyph -->
      <div style="display: inline-flex; justify-content: center; margin-bottom: 14px;">
        <svg width="52" height="42" viewBox="0 0 48 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Ship Hull with curved prow -->
          <path d="M4 28 C12 36, 32 36, 44 26 L40 32 C30 38, 12 38, 2 31 Z" fill="#111111" />
          <!-- Main Mast -->
          <path d="M22 6 L25 6 L24 28 L21 28 Z" fill="#111111" />
          <!-- Main Sail -->
          <path d="M25 8 C35 10, 36 20, 24 22 C30 18, 30 12, 25 8 Z" fill="#111111" />
          <!-- Fore Sail with Electric Lime Accent -->
          <path d="M14 10 C21 12, 21 22, 12 24 C17 20, 17 14, 14 10 Z" fill="#4CE616" />
          <!-- Top Pirate Pennant Flag -->
          <path d="M25 6 L33 9 L25 12 Z" fill="#4CE616" />
          <!-- Ram Figurehead accent dot -->
          <circle cx="6" cy="27" r="2.5" fill="#4CE616" />
        </svg>
      </div>

      <div style="font-family: var(--font-wordmark); font-size: 1.4rem; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-brand-black);">
        GOING MERRY<span style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--color-brand-accent); font-weight: 700;">™</span>
      </div>

      <div style="font-family: var(--font-tagline); font-size: 0.68rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--color-muted); margin-top: 4px;">
        AUTONOMOUS FLEET COMMAND
      </div>

      <div style="font-family: var(--font-mono); font-size: 0.68rem; color: var(--color-brand-black); background: #FAF9F6; border: 1px solid var(--color-border); padding: 3px 8px; border-radius: var(--radius-xs); display: inline-block; margin-top: 10px; font-weight: 600;">
        EST. 2024 | FLEET TELEMETRY GATE [ 0 / 30 ]
      </div>
    </div>

    <!-- Auth Form -->
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="passcode" style="display: flex; justify-content: space-between; align-items: center;">
          <span>// ENTER OPERATOR PASSCODE</span>
          <span style="font-size: 0.7rem; color: var(--color-brand-black); font-weight: 700;">[🔒 ENCRYPTED]</span>
        </label>
        <div style="position: relative;">
          <input 
            type="password" 
            id="passcode" 
            name="passcode" 
            class="form-input" 
            placeholder="Passcode..." 
            required 
            autofocus
            style="padding-right: 44px; font-size: 1.1rem; letter-spacing: 2px;"
          >
          <button 
            type="button" 
            onclick="togglePasscodeVisibility()" 
            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-muted); cursor: pointer; font-size: 1.1rem;"
            title="Toggle visibility"
          >
            👁️
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; margin-bottom: 14px; font-size: 0.95rem; padding: 14px;">
        AUTHENTICATE COMMAND CENTER ⚡
      </button>

      <div style="text-align: center; font-family: var(--font-mono); font-size: 0.72rem; color: var(--color-muted); margin-top: 14px;">
        GOING MERRY™ // AUTONOMOUS FLEET COMMAND • 30+ FLEET NODE TELEMETRY
      </div>
    </form>
  </div>
</div>

<script>
function togglePasscodeVisibility() {
  const input = document.getElementById("passcode");
  if (input.type === "password") {
    input.type = "text";
  } else {
    input.type = "password";
  }
}
</script>
{% endblock %}
