{% extends "base.html" %}

{% block title %}Sign Up — Going Merry{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
  <div class="glass-card">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="font-size: 2.5rem; margin-bottom: 8px;">🏴‍☠️</div>
      <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Join the Crew</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">Set up your personal viral video factory</p>
    </div>

    <form method="POST" action="{{ url_for('auth.signup') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="e.g. speedclips" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="captain@goingmerry.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label class="form-label" for="password">Password (min 6 characters)</label>
        <input type="password" id="password" name="password" class="form-input" required minlength="6">
      </div>

      <button type="submit" class="btn-primary" style="margin-bottom: 16px;">
        Create Account & Sail
      </button>

      <div style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
        Already a crew member? 
        <a href="{{ url_for('auth.login') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
